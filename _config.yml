# Site configuration for https://www.janglos.eu
# Theme options: https://mmistakes.github.io/minimal-mistakes/docs/configuration/
# This file is not reloaded by `jekyll serve`; restart the server after editing it.

# Theme
remote_theme             : "mmistakes/minimal-mistakes@4.28.1" # bump the version here to update the theme
minimal_mistakes_skin    : "air"

# Site Settings
locale                   : "en-US"
title                    : "Jan Glos"
title_separator          : "-"
subtitle                 : "Product Manager"
name                     : "Jan Glos"
description              : "Jan Glos - Product Manager. Background in modeling, controls, and communication. Experience in academics, buildings, and the automotive industry."
url                      : "https://www.janglos.eu"
baseurl                  : "" # site lives at the domain root
repository               : "janglos/janglos.github.io"

# SEO
google_site_verification : # Google Search Console code, if verifying via meta tag
og_image                 : /assets/img/og-image.jpg # default social preview image (1200x630)
atom_feed:
  hide                   : true # no blog posts; hides the theme's feed links
# Structured data (JSON-LD Person), rendered by _includes/schema.html
social:
  job_title              : "Product Manager"
  works_for              : "NXP Semiconductors"
  alumni_of              : "Brno University of Technology"
  location               : "Brno, Czechia"
  knows_about:
    - "Product Management"
    - "Scaled Agile Framework (SAFe)"
    - "DevOps"
    - "Automotive Ethernet"
    - "Embedded Systems"
    - "Model Predictive Control"
    - "Building Automation"
  links:
    - "https://www.linkedin.com/in/janglos/"
    - "https://github.com/janglos"
    - "https://orcid.org/0000-0001-9636-1529"
    - "https://scholar.google.com/citations?user=eyOXkfYAAAAJ"
    - "https://www.researchgate.net/profile/Jan-Glos"
    - "https://ieeexplore.ieee.org/author/37086016018"

# Analytics: GoatCounter, see _includes/analytics-providers/custom.html
analytics:
  provider               : "custom"
  goatcounter:
    id                   : janglos

# Sidebar author profile
author:
  name                   : "Jan Glos"
  avatar                 : /assets/img/avatar.jpg
  bio                    : "Product Manager"
  location               : "Brno, Czechia"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-square-envelope"
      url: "mailto:jan.glos.cz@gmail.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/janglos"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/janglos/"

# Site footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/janglos"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/janglos/"

# Reading files
include:
  - _pages
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
  - .sass-cache

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

sass:
  style: compressed

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-relative-links

# HTML compression (theme's compress layout)
compress_html:
  clippings: all
  ignore:
    envs: development
