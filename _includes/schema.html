<script type="application/ld+json">
{
  "@context": "https://schema.org",
  {% if site.social.type == "Organization" -%}
    "@type": "Organization",
    "url": {{ '/' | absolute_url | jsonify }}{% if site.og_image %},
    "logo": {{ site_og_image | jsonify }}{% endif %}{% if site.social.links %},
    "sameAs": {{ site.social.links | jsonify }}{% endif %}
  {%- else -%}
    "@type": "Person",
    "name": {{ site.social.name | default: site.name | jsonify }},
    "url": {{ '/' | absolute_url | jsonify }}{% if site.social.job_title %},
    "jobTitle": {{ site.social.job_title | jsonify }}{% endif %}{% if site.social.works_for %},
    "worksFor": { "@type": "Organization", "name": {{ site.social.works_for | jsonify }} }{% endif %}{% if site.social.alumni_of %},
    "alumniOf": { "@type": "CollegeOrUniversity", "name": {{ site.social.alumni_of | jsonify }} }{% endif %}{% if site.social.location %},
    "homeLocation": { "@type": "Place", "name": {{ site.social.location | jsonify }} }{% endif %}{% if site.author.avatar %},
    "image": {{ site.author.avatar | absolute_url | jsonify }}{% endif %}{% if site.social.knows_about %},
    "knowsAbout": {{ site.social.knows_about | jsonify }}{% endif %}{% if site.social.links %},
    "sameAs": {{ site.social.links | jsonify }}{% endif %}
  {%- endif %}
}
</script>
